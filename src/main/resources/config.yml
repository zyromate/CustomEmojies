command-usage:
  - "&6_____________.[ &2Custom Emojis &6]._____________"
  - "&b/CustomEmojis reload &eReloads the configuration"
  - "&b/emojis &eOpens the gui with all the emojis"

reload-success: "&2&lCustomEmojis &8» &fhas been reloaded &asuccessfully"

permission:
  command: customemojis.use

Gui:
  open-message: "&2&lCustomEmojis &8» &fOpening GUI"
  Size: 54
  MaxItemsPerPage: 28
  Title: "&aEmojis (Page {page}/{totalPages})"
  emoji-click-message: "&2&lCustomEmojis &8» &fYou clicked on emoji: &a{emojiName}"

  BorderItem:
    Material: "STAINED_GLASS_PANE"
    Data: 7
  BorderItemName: " "

  EmojiItem:
    Material: "PAPER"
    Name: "&cEmoji: &f{emojiName}"
    Lore:
      - "&7Before: &f{emojiName}"
      - "&7After: {emojiReplaced}"

  NavigationButton:
    Material: "ARROW"
    Lore:
      - ""
      - "&fCurrent Page {page}/{totalPages}"

  PreviousPageButton:
    Name: "&ePrevious Page"
    Slot: 45

  NextPageButton:
    Name: "&eNext Page"
    Slot: 53

  HeaderItem:
    Material: "BOOK"
    Name: "&6Emoji List"
    Slot: 4
    Lore:
      - "&7Browse through the emoji list!"
      - "&7Page {page} of {totalPages}"

